[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-passport"
version = "1.0.0"
description = "Encrypted vault for Windows WiFi credentials. AES-256-GCM, Argon2id, single file."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "lbsm2017" }]
keywords = ["wifi", "backup", "encryption", "argon2", "aes-gcm", "windows", "netsh"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = [
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
wifi-passport = "wifi_passport:main"

[tool.setuptools]
py-modules = ["wifi_passport"]
